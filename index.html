
<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>File Studio</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <header class="header">
    <div class="logo">File <span>Studio</span></div>
    <button id="settingsBtn" class="settings-btn">⚙</button>
  </header>

  <main class="container">

    <nav class="tabs">
      <button class="tab active" data-page="convert">ファイル変換</button>
      <button class="tab" data-page="merge">PDF結合</button>
      <button class="tab" data-page="split">PDF分割</button>
      <button class="tab" data-page="zip">ZIP圧縮</button>
    </nav>

    <!-- ファイル変換 -->
    <section id="convert" class="page active">

      <h1>ファイル形式変換</h1>
      <p>ファイルを追加して変換先を選択してください。</p>

      <!-- ファイル管理エリア -->
      <div class="file-manager">

        <div class="file-toolbar">

          <div class="toolbar-left">
            <button id="addFilesBtn" title="ファイルを追加">⊕</button>
            <button id="createFolderBtn" title="フォルダを作成">📁＋</button>
            <button id="downloadFilesBtn" title="選択したファイルをダウンロード">⬇</button>
          </div>

          <div class="toolbar-right">
            <button class="view-btn active" data-view="icons" title="フォルダアイコン表示">▦</button>
            <button class="view-btn" data-view="details" title="ファイル詳細表示">☷</button>
            <button class="view-btn" data-view="tree" title="ファイルツリー表示">🌳</button>
          </div>

        </div>

        <div class="file-path" id="filePath">
          📁 ファイル
        </div>

        <div id="fileList" class="file-list icon-view">
          <p class="empty-message">
            ファイルがありません。左上のボタンから追加してください。
          </p>
        </div>

        <input
          type="file"
          id="fileInput"
          multiple
          accept="image/*,.heic,.heif,.tif,.tiff,.avif,.pdf"
          hidden
        >

      </div>

      <!-- app.jsとの連携用。idは1つだけ -->
      <div id="fileName" hidden></div>

      <h3>★ お気に入り</h3>
      <div id="favoriteFormats" class="format-grid"></div>

      <button id="otherBtn" class="other-btn">
        その他の形式を見る ▼
      </button>

      <div id="otherFormats" class="format-grid hidden"></div>

      <button id="convertBtn" class="main-btn" disabled>
        変換する
      </button>

      <div id="status"></div>

    </section>

    <!-- PDF結合 -->
    <section id="merge" class="page hidden">
      <h1>PDF結合</h1>
      <input type="file" id="mergeInput" accept=".pdf" multiple>
      <button id="mergeBtn" class="main-btn">PDFを結合</button>
    </section>

    <!-- PDF分割 -->
    <section id="split" class="page hidden">
      <h1>PDF分割</h1>
      <input type="file" id="splitInput" accept=".pdf">

      <select id="splitMode">
        <option value="each">1ページずつ分割</option>
        <option value="range">ページ範囲を指定</option>
      </select>

      <input id="pageRange" placeholder="例：1-3, 4-6">

      <button id="splitBtn" class="main-btn">PDFを分割</button>
    </section>

    <!-- ZIP圧縮 -->
    <section id="zip" class="page hidden">
      <h1>ZIP圧縮</h1>
      <input type="file" id="zipInput" multiple>
      <input id="zipName" value="archive.zip">
      <button id="zipBtn" class="main-btn">ZIPを作成</button>
    </section>

    <!-- 設定 -->
    <section id="settings" class="page hidden">
      <h1>お気に入り設定</h1>
      <div id="favoriteSettings"></div>
    </section>

  </main>

  <!-- ライブラリ -->
  <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/utif@3.1.0/UTIF.min.js"></script>

  <!-- アプリ本体 -->
  <script src="js/image-converter.js"></script>
  <script src="js/file-manager.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
