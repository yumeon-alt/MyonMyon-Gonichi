<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>File Studio</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <header class="header">
    <div class="logo">File <span>Studio</span></div>
    <button id="settingsBtn" class="settings-btn">⚙</button>
  </header>

  <main class="container">

    <nav class="tabs">
      <button class="tab active" data-page="convert">ファイル変換</button>
      <button class="tab" data-page="pdf-editor">PDF編集</button>
      <button class="tab" data-page="zip">ZIP圧縮</button>
    </nav>

    <!-- 1. ファイル変換セクション -->
    <section id="convert" class="page active">
      <h1>ファイル形式変換</h1>
      <p>ファイルを追加して変換先を選択してください。</p>

      <div class="file-manager">
        <div class="file-toolbar">
          <div class="toolbar-left">
            <button id="addFilesBtn" title="ファイルを追加">⊕</button>
            <button id="createFolderBtn" title="フォルダを作成">📁＋</button>
            <button id="downloadFilesBtn" title="選択したファイルをダウンロード">⬇</button>
          </div>
          <div class="toolbar-right">
            <button class="view-btn active" data-view="icons" title="フォルダアイコン表示">▦</button>
            <button class="view-btn" data-view="details" title="ファイル詳細表示">☷</button>
            <button class="view-btn" data-view="tree" title="ファイルツリー表示">🌳</button>
          </div>
        </div>

        <div class="file-path" id="filePath">📁 ファイル</div>
        <div id="fileList" class="file-list"></div>
        <input type="file" id="fileInput" multiple accept="image/*,.heic,.heif,.tif,.tiff,.avif,.pdf" hidden>
      </div>

      <div id="fileName" hidden></div>

      <h3>★ お気に入り</h3>
      <div id="favoriteFormats" class="format-grid"></div>

      <button id="otherBtn" class="other-btn">その他の形式を見る ▼</button>
      <div id="otherFormats" class="format-grid hidden"></div>

      <button id="convertBtn" class="main-btn" disabled>変換する</button>
      <div id="status"></div>
    </section>

    <!-- 2. PDF編集セクション（結合・分割・順序変更統合版） -->
    <section id="pdf-editor" class="page hidden">
      <h1>PDF編集（結合・分割・順序変更）</h1>
      <p style="margin-bottom: 12px; color: #555;">PDFや画像をドラッグ＆ドロップしてページの並び替えや削除・結合ができます。</p>

      <div style="border: 1px solid #d0d7de; border-radius: 6px; background: #fff; overflow: hidden;">
        <div style="background: #f6f8fa; padding: 10px 12px; border-bottom: 1px solid #d0d7de; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
          <div style="display: flex; gap: 8px; align-items: center;">
            <button id="pdfAddBtn" class="tool-btn" style="padding: 6px 12px; background: #fff; border: 1px solid #d0d7de; border-radius: 4px; cursor: pointer;">➕ ファイル追加</button>
            <button id="pdfClearBtn" class="tool-btn" style="padding: 6px 12px; background: #fff; border: 1px solid #d0d7de; border-radius: 4px; cursor: pointer; color: #d73a49;">🗑️ すべてクリア</button>
          </div>
          <div style="display: flex; gap: 8px; align-items: center;">
            <button id="pdfViewTextBtn" class="view-btn active" style="padding: 4px 8px; border: 1px solid #cbd0d8; border-radius: 4px; cursor: pointer; background: #fff;" title="リスト表示">☷ リスト表示</button>
            <button id="pdfViewThumbBtn" class="view-btn" style="padding: 4px 8px; border: 1px solid #cbd0d8; border-radius: 4px; cursor: pointer; background: #fff;" title="画像表示">▦ 画像表示</button>
          </div>
        </div>

        <div style="padding: 8px 12px; border-bottom: 1px solid #eee; font-size: 0.9rem; color: #555; background: #fff;">
          📕 PDF構成ページ一覧
        </div>

        <div id="pdfDropZone" class="file-list" style="min-height: 250px; padding: 12px; position: relative; background: #fff; cursor: pointer;">
          <input type="file" id="pdfInput" multiple accept="image/*,.pdf,.heic,.heif,.tif,.tiff,.avif" style="display: none;">
        </div>
      </div>

      <div style="margin-top: 20px; display: flex; gap: 10px; flex-wrap: wrap;">
        <input type="text" id="pdfOutputName" value="merged.pdf" style="padding: 10px 14px; border: 1px solid #ccc; border-radius: 8px; flex: 1; min-width: 200px; font-size: 1rem;" placeholder="出力ファイル名">
        <button id="pdfExportBtn" class="main-btn" style="margin-top: 0; width: auto; padding: 12px 24px; background: #6559bb;">PDFを出力・保存</button>
      </div>

      <div id="pdfStatus" style="margin-top: 15px; color: #555;"></div>
    </section>

    <!-- 3. ZIP圧縮セクション -->
    <section id="zip" class="page hidden">
      <h1>ZIP圧縮</h1>
      <p style="margin-bottom: 12px; color: #555;">ファイルを追加してZIPファイルにまとめてダウンロードできます。</p>

      <div style="border: 1px solid #d0d7de; border-radius: 6px; background: #fff; overflow: hidden;">
        <div style="background: #f6f8fa; padding: 10px 12px; border-bottom: 1px solid #d0d7de; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
          <div style="display: flex; gap: 8px; align-items: center;">
            <button id="zipAddBtn" class="tool-btn" style="padding: 6px 12px; background: #fff; border: 1px solid #d0d7de; border-radius: 4px; cursor: pointer;">➕ 追加</button>
            <button id="zipClearBtn" class="tool-btn" style="padding: 6px 12px; background: #fff; border: 1px solid #d0d7de; border-radius: 4px; cursor: pointer; color: #d73a49;">🗑️ クリア</button>
          </div>
          <div style="display: flex; gap: 8px; align-items: center;">
            <input type="text" id="zipName" value="archive.zip" style="padding: 5px 10px; border: 1px solid #d0d7de; border-radius: 4px; font-size: 0.9rem;">
            <button id="zipBtn" class="main-btn" style="padding: 6px 14px; background: #2ea44f; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 0;">ZIPを作成</button>
          </div>
        </div>

        <div style="padding: 8px 12px; border-bottom: 1px solid #eee; font-size: 0.9rem; color: #555; background: #fff;">
          📁 ZIP圧縮対象ファイル
        </div>

        <div id="zipDropZone" class="file-list" style="min-height: 220px; padding: 12px; position: relative; background: #fff; cursor: pointer;">
          <input type="file" id="zipInput" multiple style="display: none;">
        </div>
      </div>

      <div id="zipResultArea" class="hidden" style="display: none; align-items: center; gap: 10px; background: #f0f9f0; padding: 12px; border-radius: 6px; border: 1px solid #c3e6cb; margin-top: 15px;">
        <span id="zipSuccessMsg" style="color: #28a745; font-weight: bold;">📦 圧縮できました！</span>
        <button id="zipDownloadBtn" class="main-btn" style="padding: 6px 14px; background: #2ea44f; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 0;">ダウンロード</button>
      </div>
    </section>

    <!-- 4. お気に入り設定セクション -->
    <section id="settings" class="page hidden">
      <h1>お気に入り設定</h1>
      <div id="favoriteSettings"></div>
    </section>

  </main>

  <!-- ライブラリ (PDF描画・レンダリング用に pdf.js を追加) -->
  <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/utif@3.1.0/UTIF.min.js"></script>

  <!-- アプリ本体 -->
  <script src="js/image-converter.js"></script>
  <script src="js/file-manager.js"></script>
  <script src="js/pdf-editor.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
